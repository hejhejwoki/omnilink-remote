name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Verify and Grant Execute Permission for Gradle Wrapper
      run: |
        if [ -f "./gradlew" ]; then
          echo "Found gradlew wrapper. Granting execute permissions..."
          chmod +x gradlew
        else
          echo "Warning: gradlew is missing from the repository! 🥀"
          echo "The pipeline will attempt to use the system Gradle fallback, but this may fail due to version mismatches."
        fi
      shell: bash
      
    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          echo "Executing build via local gradlew wrapper..."
          ./gradlew assembleDebug --no-daemon
        else
          echo "gradlew not found. Falling back to system Gradle..."
          gradle assembleDebug --no-daemon
        fi
      shell: bash
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OmniLink-Remote-APK
        path: app/build/outputs/apk/debug/app-debug.apk