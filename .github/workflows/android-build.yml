name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # This action intercepts the missing wrapper issue and forces Gradle 8.7 (Required for AGP 8.6.0)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.7"

    - name: Verify and Grant Execute Permission for Gradle Wrapper
      run: |
        if [ -f "./gradlew" ]; then
          echo "Found gradlew wrapper. Granting execute permissions..."
          chmod +x gradlew
        else
          echo "Warning: gradlew is missing! 🥀 Using injected Gradle 8.7 fallback."
        fi
      shell: bash
      
    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          echo "Executing build via local gradlew wrapper..."
          ./gradlew assembleDebug --no-daemon
        else
          echo "gradlew not found. Falling back to injected Gradle 8.7..."
          gradle assembleDebug --no-daemon
        fi
      shell: bash
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OmniLink-Remote-APK
        path: app/build/outputs/apk/debug/app-debug.apk